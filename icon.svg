<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- 手のシンボル（モダンな白のアウトライン） -->
  <path d="M 180 340 
           C 170 320, 155 270, 140 250 
           C 130 235, 150 220, 165 235 
           C 180 250, 195 285, 205 295
           L 205 180
           C 205 160, 230 160, 230 180
           L 230 260
           L 235 150
           C 235 130, 260 130, 260 150
           L 260 260
           L 265 165
           C 265 145, 290 145, 290 165
           L 290 270
           L 295 200
           C 295 180, 320 180, 320 200
           L 320 310
           C 320 370, 270 410, 220 410
           C 180 410, 150 375, 180 340 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- 指先の上に並ぶカウントドット（丸印） -->
  <circle cx="130" cy="215" r="20" fill="url(#dotGrad)" filter="url(#glow)" />
  <circle cx="190" cy="140" r="20" fill="url(#dotGrad)" filter="url(#glow)" />
  <circle cx="260" cy="105" r="22" fill="url(#dotGrad)" filter="url(#glow)" />
  <circle cx="330" cy="135" r="20" fill="url(#dotGrad)" filter="url(#glow)" />
  <circle cx="385" cy="195" r="20" fill="url(#dotGrad)" filter="url(#glow)" />
</svg>
